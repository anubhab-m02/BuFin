# Serves the built single-page app and proxies the API, so the browser sees one origin.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Statement and receipt uploads; the backend enforces its own limits.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Scripts only from this origin. Styles allow inline (charts set style attributes) and Google Fonts;
    # avatars come from Dicebear; all API calls are same-origin. Tighten as the Design v2 work removes externals.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.dicebear.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Readiness opens a database connection per call, so it is not exposed to anonymous internet traffic.
    # The api container's own health checks and internal tooling reach it directly on the Compose network.
    location = /api/ready {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # OVERWRITE (not append) so a client-supplied X-Forwarded-For is never trusted: the backend's
        # rate limiter keys on this address, and every user would otherwise share the proxy's.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI coach calls can be slow
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
