# Local development database. BuFin runs on PostgreSQL only (docs/architecture/DECISIONS.md, ADR-6).
# Start it:   docker compose up -d postgres
# Create the schema (once, and after pulling new migrations):   cd backend && alembic upgrade head
# Fixed development credentials, matching DATABASE_URL in .env.example; the port is bound to
# 127.0.0.1 only. Production credentials come from the environment, never from this file.
# Postgres applies the password only when the volume is first created: after changing it, run
# `docker compose down -v` to recreate the database.
x-backend: &backend
  build: ./backend
  image: bufin-backend:local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bufin
      POSTGRES_PASSWORD: bufin_dev_password
      POSTGRES_DB: bufin
    ports:
      # 5433 on the host so it cannot collide with a Postgres you already run on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - bufin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bufin -d bufin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Full stack: docker compose --profile full up --build ---------------------------------------
  # Needs JWT_SECRET_KEY in a root .env file (see .env.example). The default `docker compose up -d
  # postgres` workflow above is unchanged: these services start only under the `full` profile.

  # One-shot: applies the migrations once, then exits. api starts only after it succeeds, so several
  # api replicas can never race to migrate, and a failed migration stops the stack with a clear error.
  migrate:
    <<: *backend
    profiles: ["full"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://bufin:bufin_dev_password@postgres:5432/bufin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    profiles: ["full"]
    # A missing JWT secret makes the app exit at start-up; retry a few times, then stay down so the
    # error is visible instead of looping forever.
    restart: on-failure:5
    environment:
      # Production mode refuses to start without a strong JWT secret (backend/auth_utils.py).
      BUFIN_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://bufin:bufin_dev_password@postgres:5432/bufin
      # nginx (web) overwrites X-Forwarded-For with the real peer address; trust it so the rate
      # limiter sees real clients. "*" is safe ONLY because api publishes no port: it is reachable
      # solely through nginx on the Compose network. Never add a `ports:` entry here, or anything
      # that can reach it directly could forge client addresses and dodge the rate limits.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s  # a little above uvicorn's 20 s graceful-shutdown window
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  bufin_pgdata:
